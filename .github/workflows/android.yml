name: Build APK

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      # The owner's signing key, so every APK keeps the same SHA-1 that the
      # Google Cloud OAuth client is registered against.
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/sender.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/sender.jks" >> "$GITHUB_ENV"
            echo "Signing with the owner keystore."
          else
            echo "KEYSTORE_BASE64 is not set - the release APK will be unsigned."
            echo "Add the keystore secrets before giving the APK to anyone (see README)."
          fi

      - name: Build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:assembleDebug :app:assembleRelease

      - name: Report signing fingerprint
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          [ -f "$APK" ] || APK=app/build/outputs/apk/release/app-release-unsigned.apk
          echo "Built: $APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" \
            | grep -i "SHA-1" || echo "Unsigned - add the keystore secrets (see README)."

      - uses: actions/upload-artifact@v4
        with:
          name: gmail-sender-apk
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
